# Reverse proxy for RunCoach.
#
# Two things here are not boilerplate, and both of them break the product
# rather than degrading it.
#
# WebSocket upgrade. The voice path is a WebSocket, and a proxy that does not
# forward the Upgrade and Connection headers turns it into an ordinary HTTP
# request that fails at the handshake. The client then falls back to text and
# the headline feature is simply absent, with nothing in the logs that looks
# like an error.
#
# Read timeout. nginx closes an idle upstream connection after 60 seconds by
# default. A voice session where the runner stops to think for a minute would be
# cut mid-conversation, which looks exactly like a bug in the application.

# Announcing the exact patch version tells an attacker which CVEs to try first.
server_tokens off;

# Access logs recorded a full IP address for every request, which is personal
# data collected by default and never mentioned to anyone. The last octet is
# dropped before writing: enough to tell one visitor's session from another
# while debugging, not enough to identify a household. Applied by logging a
# masked variable rather than by turning the log off, because a deployment
# nobody can debug is its own problem.
map $remote_addr $ip_anon {
    ~(?P<head>\d+\.\d+\.\d+)\.    $head.0;
    ~(?P<head6>[^:]+:[^:]+):          $head6::;
    default                            0.0.0.0;
}

log_format privado '$ip_anon - - [$time_local] "$request" $status $body_bytes_sent';

upstream runcoach {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # Inside the server block, not beside it. At http level this would be an
    # additional log rather than a replacement, and every request would be
    # written twice: once masked, once not, which is worse than not masking at
    # all because it looks done.
    access_log /var/log/nginx/access.log privado;

    # certbot writes its challenge here before the redirect applies, so renewal
    # keeps working without taking the site down.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # The `http2 on;` directive arrived in nginx 1.25 and Ubuntu 24.04 LTS ships
    # 1.24, where it is a fatal "unknown directive". This older form is
    # deprecated in 1.25+ but still accepted, so it works on both; the newer one
    # only works on one, and the one it does not work on is the one being
    # deployed to.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN_PLACEHOLDER;

    access_log /var/log/nginx/access.log privado;

    # certbot fills these in and manages renewal.
    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Audio frames are small and constant; buffering them adds latency to a
    # conversation for no gain.
    proxy_buffering off;

    # Security headers. The site had none, which a review found by asking for
    # them. Each one closes something specific:
    #
    # HSTS so a first visit typed without a scheme cannot be downgraded before
    # the redirect happens. Two years and preload-ready, which is the point of
    # the header rather than a token gesture.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # No MIME sniffing: a stored transcript must never be executed as script.
    add_header X-Content-Type-Options "nosniff" always;
    # No framing, so nobody can put a transparent microphone button over theirs.
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The client already loads nothing from the internet, and a test enforces
    # that. This is the same promise stated where a browser will act on it.
    add_header Content-Security-Policy
        "default-src 'self'; connect-src 'self' wss://$host; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'" always;
    # The microphone is the only device this needs, and nothing needs to be
    # geolocated or watched.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    client_max_body_size 2m;

    # The voice WebSocket.
    location /ws/ {
        proxy_pass http://runcoach;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough that a runner pausing to think does not end the session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://runcoach;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}
